name: Verificacion de la plataforma
on: [push, pull_request]
jobs:
  demo-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
  objetivo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: docker info
      - run: mvn -B clean test
        working-directory: backend
      - run: |
          python - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files=glob.glob('backend/target/surefire-reports/TEST-*FlujoPostgresTest.xml')
          assert files, 'Falta reporte de prueba PostgreSQL'
          root=ET.parse(files[0]).getroot()
          assert int(root.attrib.get('tests','0'))>0 and int(root.attrib.get('skipped','0'))==0, 'Prueba PostgreSQL omitida'
          PY
      - run: mkdir -p backend/src/main/resources/static && cp -R frontend/dist/. backend/src/main/resources/static/
      - run: mvn -B -DskipTests package
        working-directory: backend
