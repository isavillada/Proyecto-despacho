spring.application.name=despacho-cultura
server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cultura}
spring.datasource.username=${POSTGRES_USER:cultura}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.flyway.enabled=true
spring.sql.init.mode=never
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.web.resources.static-locations=classpath:/static/,file:./static/
server.error.include-message=never
server.error.include-stacktrace=never
app.secret=${APP_SECRET:}
app.admin-password=${ADMIN_PASSWORD:}
app.upload-dir=${UPLOAD_DIR:./uploads}
