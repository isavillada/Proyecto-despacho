services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cultura
      POSTGRES_USER: cultura
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cultura -d cultura"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/cultura
      POSTGRES_USER: cultura
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
      APP_SECRET: ${APP_SECRET:?Configure APP_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Configure ADMIN_PASSWORD}
      UPLOAD_DIR: /app/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:?Configure APP_PORT}:8080"
    volumes:
      - documentos:/app/uploads
    restart: unless-stopped
volumes:
  postgres_data:
  documentos:
